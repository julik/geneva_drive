# The test suite runs against SQLite by default so that a fresh clone can run
# `rake` with no database server. CI overrides this with DATABASE_URL to also
# exercise PostgreSQL and MySQL.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3
