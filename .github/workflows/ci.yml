name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: "Lint (standardrb)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec standardrb

  # The appraisal gemfiles are generated from Appraisals, so they are the one
  # place the supported Rails versions are written down. bin/matrix defaults to
  # the same list, which is what keeps a local run and CI testing the same set.
  appraisals:
    name: "Work out the appraisal list"
    runs-on: ubuntu-latest
    outputs:
      rails: ${{ steps.list.outputs.rails }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: List the appraisals
        id: list
        run: |
          rails=$(ls gemfiles/*.gemfile | xargs -n1 basename | sed 's/\.gemfile$//' | jq -R . | jq -sc .)
          echo "rails=$rails" >> "$GITHUB_OUTPUT"
          echo "Appraisals: $rails"

  test:
    name: "Tests (${{ matrix.rails }}, ${{ matrix.database }})"
    needs: appraisals
    runs-on: ubuntu-latest
    env:
      # Job-level so that setup-ruby's bundler-cache keys on the right lockfile.
      # bin/matrix sets the same value per cell.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        rails: ${{ fromJSON(needs.appraisals.outputs.rails) }}
        database: [sqlite, postgres, mysql]

    steps:
      # Must run before setup-ruby: bundler-cache builds the pg and mysql2 native
      # extensions, which need the client headers.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      # One cell of the same script a local run uses, rather than a second
      # description of the matrix here: it starts the one engine it needs out of
      # compose.yaml, asks compose which port it got, and builds the
      # DATABASE_URL - or leaves it unset for SQLite. test_helper.rb then
      # generates the migrations and prepares the database.
      - name: Run tests
        run: bin/matrix "${{ matrix.rails }}" "${{ matrix.database }}"
