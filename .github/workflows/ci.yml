name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: "Lint (standardrb)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec standardrb

  test:
    name: "Tests (${{ matrix.rails }}, ${{ matrix.database.name }})"
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        rails:
          - rails_7_2
          - rails_8_0
          - rails_8_1
        database:
          - { name: 'PostgreSQL', url: 'postgresql://postgres:postgres@localhost:5432/geneva_drive_test' }
          - { name: 'MySQL', url: 'mysql2://root:root@127.0.0.1:3306/geneva_drive_test?encoding=utf8mb4' }
          # No URL at all: the dummy app already defaults to SQLite and works out
          # its own path relative to Rails.root, which stays correct inside the
          # bin/rails subprocess test_helper shells out to. Spelling it out here
          # is not an option either - the matrix is evaluated before the job has
          # a workspace, so github.workspace is empty and the absolute path came
          # out as /test/dummy/db/...
          - { name: 'SQLite', url: '' }

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geneva_drive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: geneva_drive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Must run before setup-ruby: bundler-cache builds the pg and mysql2 native
      # extensions, which need the client headers.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Run tests
        # test_helper.rb auto-generates migrations and prepares the database
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ matrix.database.url }}
        run: |
          # An empty DATABASE_URL is still a set DATABASE_URL as far as Rails is
          # concerned, and the SQLite leg wants it genuinely absent.
          if [ -z "${DATABASE_URL:-}" ]; then unset DATABASE_URL; fi
          bundle exec rake test
